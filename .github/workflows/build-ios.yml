name: Build iOS (unsigned ipa)
on:
  push:
    branches: [main]
    # 앱에 영향 없는 변경은 빌드하지 않는다 (macOS 무료 분량 절약)
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tests/**'
      - 'tools/**'
      - 'samples/**'
  workflow_dispatch:
    inputs:
      bump:
        description: '올릴 버전 자리 (main 에서 실행할 때만 Release 를 만든다)'
        type: choice
        options: [patch, minor, major]
        default: patch

# 한 번에 하나씩 돌린다. 버전 계산과 태그 생성이 겹치지 않게 하려는 것 (진행 중인 실행은 끝까지 돈다)
concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# 초안 (docs/DEV_PLAN.md). 실제로 돌려 보고 맞춘다. M0 에서 검증할 것:
#  - Unity Personal 라이선스 활성화 (secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD)
#  - GameCI 출력 경로 (아래는 find 로 Unity-iPhone.xcodeproj 를 찾아 경로 차이를 흡수)
#  - 서명 없는 .ipa 를 Sideloadly 가 받아 주는지

jobs:
  # 마지막 vX.Y.Z 태그에서 한 자리 올린다. 푸시는 patch, 수동 실행은 bump 입력을 따른다. 태그가 없으면 0.1.0.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 태그를 읽으려고
      # Unity 프로젝트를 에디터로 한 번 열어 커밋하기 전에는(docs/build-and-install.md 1~2단계) 빌드를 건너뛴다.
      # 실패로 두면 그때까지 main 푸시마다 빨간 X 가 뜨므로 경고만 남긴다.
      - id: ready
        run: |
          MISSING=""
          for f in unity/ProjectSettings/ProjectVersion.txt unity/Packages/manifest.json unity/Assets/Scanner/Scenes/Scanner.unity; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::warning title=iOS 빌드 건너뜀::Unity 프로젝트가 아직 준비되지 않았습니다. 없는 파일:$MISSING (docs/build-and-install.md 참고)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - id: v
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          LAST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$LAST" ]; then
            NEXT=0.1.0
          else
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            case "$BUMP" in
              major) NEXT="$((MA+1)).0.0" ;;
              minor) NEXT="$MA.$((MI+1)).0" ;;
              *)     NEXT="$MA.$MI.$((PA+1))" ;;
            esac
          fi
          echo "last=${LAST:-none} → next=$NEXT ($BUMP)"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

  unity-export:
    needs: version
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          MISSING=""
          for n in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do [ -n "${!n}" ] || MISSING="$MISSING $n"; done
          if [ -n "$MISSING" ]; then
            echo "::error title=Unity 시크릿 없음::레포 Settings → Secrets and variables → Actions 에 등록하세요:$MISSING"
            exit 1
          fi
      # TODO: iOS 모듈이 든 Unity 이미지가 커서 디스크가 모자라면 free-disk-space 단계 추가
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-iOS-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: iOS
          buildMethod: RackScanner.EditorTools.RackScannerBuild.BuildIOS
          versioning: None   # 버전은 위 version 잡이 정하고 BuildIOS 가 -appVersion 으로 받는다
          customParameters: -appVersion ${{ needs.version.outputs.version }} -appBuild ${{ github.run_number }}
      # Xcode 프로젝트 안의 셸 스크립트 실행 권한을 지키려고 tar 로 묶어 올린다 (upload-artifact 는 권한을 잃음)
      - name: Pack Xcode project
        run: |
          PROJ=$(find build -name Unity-iPhone.xcodeproj -maxdepth 4 | head -1)
          test -n "$PROJ" || { echo "Unity-iPhone.xcodeproj not found under build/"; find build -maxdepth 3; exit 1; }
          tar -czf xcode-project.tgz -C "$(dirname "$PROJ")" .
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tgz
          retention-days: 1

  xcode-build:
    needs: unity-export
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
      - name: Unpack
        run: mkdir xcode-project && tar -xzf xcode-project.tgz -C xcode-project
      - name: Archive without signing
        run: |
          cd xcode-project
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -archivePath ../build/app.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO
      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qr app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: app.ipa
          retention-days: 3   # 오래 둘 것은 Release 에 있다

  # main 에서만 태그 vX.Y.Z 를 만들고 Release 에 ipa 를 올린다 (다른 브랜치 수동 실행은 Artifacts 만)
  release:
    needs: [version, xcode-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-ipa
      - run: mv app.ipa "RackScanner-v$VERSION.ipa"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: RackScanner-v${{ env.VERSION }}.ipa
